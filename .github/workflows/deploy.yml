name: Déploiement OVH

# Se lance à chaque push sur main, ou à la main depuis l'onglet Actions de GitHub.
# Chaque site de dist/ est envoyé dans son propre dossier OVH. Un site dont le secret
# OVH_DOSSIER_<SITE> est vide n'est pas déployé : on peut activer les sites un par un.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-ovh
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer les sites
        run: node build.mjs

      # Les deux jeux du projet ZZ1 (C + SDL2), compilés en WebAssembly depuis
      # github.com/happyfury006/projet-zz1 et publiés dans julen.sometgarcia.fr/jeux/
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Compiler les jeux en WebAssembly
        run: bash scripts/jeux-web.sh

      # Démo de la boutique PHP (github.com/happyfury006/projetwebzz2), sur la base
      # MySQL d'OVH ; ignorée tant que le secret DEMO_DB_BASE n'est pas renseigné
      - name: Publier la boutique PHP
        env:
          DEMO_DB_HOTE: ${{ secrets.DEMO_DB_HOTE }}
          DEMO_DB_UTILISATEUR: ${{ secrets.DEMO_DB_UTILISATEUR }}
          DEMO_DB_MOT_DE_PASSE: ${{ secrets.DEMO_DB_MOT_DE_PASSE }}
          DEMO_DB_BASE: ${{ secrets.DEMO_DB_BASE }}
        run: bash scripts/demo-php.sh

      - name: Vérifier les dossiers cibles
        # Garde-fou : le miroir supprime les fichiers distants absents de dist/<site>/.
        # Un mauvais dossier (racine de l'hébergement, dossier d'un autre site…) l'effacerait.
        env:
          RACINE: ${{ secrets.OVH_DOSSIER_RACINE }}
          JULEN: ${{ secrets.OVH_DOSSIER_JULEN }}
          MAITANE: ${{ secrets.OVH_DOSSIER_MAITANE }}
        run: bash scripts/verifier-dossiers.sh

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Le mot de passe passe par LFTP_PASSWORD (--env-password) : aucun caractère spécial ne peut casser la commande
      - name: Tester la connexion SFTP
        env:
          HOTE: ${{ secrets.OVH_HOTE }}
          UTILISATEUR: ${{ secrets.OVH_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.OVH_MOT_DE_PASSE }}
        run: |
          HOTE="${HOTE// /}"; HOTE="${HOTE#sftp://}"; HOTE="${HOTE#ftp://}"; HOTE="${HOTE#*@}"; HOTE="${HOTE%%[:/]*}"
          echo "Connexion à $HOTE avec l'utilisateur '$UTILISATEUR'"
          if ! lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 1;
            set net:timeout 20;
            open --env-password -u \"$UTILISATEUR\" sftp://$HOTE;
            cls -1 --sort=name
          "; then
            echo "::error::Connexion SFTP impossible. Vérifie OVH_HOTE (ex. ftp.cluster127.hosting.ovh.net, sans ftp:// ni port), OVH_UTILISATEUR et OVH_MOT_DE_PASSE (onglet FTP-SSH d'OVH)."
            exit 1
          fi

      - name: Envoyer sur OVH (SFTP)
        env:
          HOTE: ${{ secrets.OVH_HOTE }}
          UTILISATEUR: ${{ secrets.OVH_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.OVH_MOT_DE_PASSE }}
          RACINE: ${{ secrets.OVH_DOSSIER_RACINE }}
          JULEN: ${{ secrets.OVH_DOSSIER_JULEN }}
          MAITANE: ${{ secrets.OVH_DOSSIER_MAITANE }}
        run: |
          HOTE="${HOTE// /}"; HOTE="${HOTE#sftp://}"; HOTE="${HOTE#ftp://}"; HOTE="${HOTE#*@}"; HOTE="${HOTE%%[:/]*}"
          miroirs=""
          ajouter() { [ -n "$2" ] && miroirs="$miroirs mirror --reverse --delete --verbose --parallel=4 dist/$1/ \"$2\";"; }
          ajouter racine "$RACINE"
          ajouter julen "$JULEN"
          ajouter maitane "$MAITANE"
          lftp -c "
            set sftp:auto-confirm yes;
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$UTILISATEUR\" sftp://$HOTE;
            $miroirs
          "
